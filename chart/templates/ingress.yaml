{{- if .Values.ingress.enabled -}}
{{- $fullName := include "opentakserver.fullname" . -}}
{{- $svcBackendPort := .Values.backend.service.port -}}
{{- $svcFrontendPort := .Values.frontend.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "opentakserver.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if .serviceName }}{{ .serviceName }}{{ else }}{{ if eq .backend "backend" }}{{ $fullName }}-backend{{ else }}{{ $fullName }}-frontend{{ end }}{{ end }}
                port:
                  number: {{ if .servicePort }}{{ .servicePort }}{{ else }}{{ if eq .backend "backend" }}{{ $svcBackendPort }}{{ else }}{{ $svcFrontendPort }}{{ end }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
