apiVersion: v1
kind: Service
metadata:
  name: {{ include "opentakserver.fullname" . }}-backend
  labels:
    {{- include "opentakserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 8088
      targetPort: 8088
      protocol: TCP
      name: cot-tcp
    - port: 8089
      targetPort: 8089
      protocol: TCP
      name: cot-ssl
  selector:
    {{- include "opentakserver.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
