{{- if .Values.rabbitmq.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opentakserver.fullname" . }}-rabbitmq
  labels:
    {{- include "opentakserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: amqp
      name: amqp
    - port: 15672
      targetPort: management
      name: management
    - port: 1883
      targetPort: mqtt
      name: mqtt
    - port: 8883
      targetPort: mqtt-ssl
      name: mqtt-ssl
    - port: 25672
      targetPort: federation
      name: federation
  selector:
    {{- include "opentakserver.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
{{- end }}
